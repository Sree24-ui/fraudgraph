[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudgraph"
version = "0.1.0"
description = "Explainable event-time transaction network triage"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "argon2-cffi>=23,<26"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.package-data]
fraudgraph = ["static/*"]

[tool.setuptools.packages.find]
include = ["fraudgraph*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
